name: Monthly TopCV and ITviec crawl

on:
  schedule:
    # 09:17 on the first day of each month in Vietnam (UTC+7).
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-job-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python and Chrome dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chrome
      - name: Crawl with one headless Chrome session and prepare monthly batch
        run: |
          python -m src.collection.monthly_crawl \
            --out-dir "data/monthly_crawl/${GITHUB_RUN_ID}" \
            --pages-per-role 2 --pages-per-query 3 \
            --details-per-role-source 15 --delay 2
      - name: Merge eligible JDs into shared CSV
        run: |
          RUN_DIR="data/monthly_crawl/${GITHUB_RUN_ID}"
          python -m src.preparation.public_export \
            --input "$RUN_DIR/prepared/jds_eligible.csv" \
            --out "$RUN_DIR/eligible_public.csv"
          python -m src.preparation.merge_public_dataset \
            --base datasets/eligible_jds.csv \
            --incoming "$RUN_DIR/eligible_public.csv" \
            --out datasets/eligible_jds.csv
      - name: Run offline tests before publishing
        run: python -m pytest -q
      - name: Commit shared CSV if it changed
        run: |
          git add datasets/eligible_jds.csv
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update eligible JD dataset for ${GITHUB_RUN_ID}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload aggregate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-job-summary-${{ github.run_id }}
          path: |
            data/monthly_crawl/${{ github.run_id }}/plan.json
            data/monthly_crawl/${{ github.run_id }}/summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload full JD snapshot for private repositories only
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-job-data-${{ github.run_id }}
          path: |
            data/monthly_crawl/${{ github.run_id }}/jobs.jsonl
            data/monthly_crawl/${{ github.run_id }}/prepared/
            data/monthly_crawl/${{ github.run_id }}/errors.jsonl
            data/monthly_crawl/${{ github.run_id }}/events.jsonl
          if-no-files-found: warn
          retention-days: 90
