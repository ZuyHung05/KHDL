sources:
  - source_id: it_job_posting
    repository: SonPhatTranDeveloper/IT-Job-Posting
    ref: main
    enabled: true
    files:
      - {path: job_descriptions.csv, format: csv, encoding: utf-8-sig, title: title, description: description, url: job_url, company: company}
  - source_id: dpl_evaluation
    repository: Coc-di-lam/dpl_evaluation
    ref: master
    enabled: true
    files:
      - {path: data/jobs_below_mid.json, format: json, encoding: utf-8-sig, title: tên job, description: raw job, company: company}
  - source_id: vietjobs
    repository: VinNLP/VietJobs
    ref: main
    enabled: true
    note: GitHub sample only; full dataset is hosted separately.
    files:
      - {path: data/VietJobs_sample.csv, format: csv, encoding: utf-8-sig, title: job_title, description: description}
  - source_id: data_job_analysis
    repository: phuocnguyen90/Data_job_analysis_notebook
    ref: main
    enabled: true
    note: JD_Trans is transformed text.
    files:
      - {path: Data_Jobs.csv, format: csv, encoding: cp1252, title: Job_Title, description: JD_Trans}
  - source_id: careersgovsg
    repository: opengovsg/careersgovsg-jobs-data
    ref: main
    enabled: true
    license: "Repository MIT; job data subject to https://jobs.careers.gov.sg/terms-of-use"
    note: Singapore government job listings across industries; JSON and CSV are alternate exports of the same dataset.
    files:
      - {path: data/job-listings.json, format: json, encoding: utf-8-sig, title: jobTitle, description: jobDescription, company: agency}
  - source_id: ady201m
    repository: Therockycloud/ADY201m
    ref: main
    enabled: true
    license: unknown
    note: Repository is archived; raw JSON contains mixed job categories and may include non-IT postings.
    files:
      - {path: src/rawdata/recruit_1_1.json, format: json, encoding: utf-8-sig, title: name, description: "Mô tả công việc", url: source_url}
  - source_id: awesome_jobs_vietnam
    repository: awesome-jobs/vietnam
    type: github_issues
    ref: master
    enabled: true
    license: unknown
    note: Open GitHub issues only; one issue may describe several jobs and issue bodies can contain contact information.
    files:
      - {path: issues/open.jsonl, format: jsonl, encoding: utf-8-sig, title: title, description: body, url: html_url}
